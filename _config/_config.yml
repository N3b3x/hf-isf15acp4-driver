# =============================================================================
# Jekyll Configuration — HF-ISF15ACP4 Driver Documentation
# =============================================================================

title: "HardFOC ISF15ACP4 Driver"
description: >
  Hardware-agnostic C++ driver for the NKK ISF15ACP4 96×64 RGB OLED SmartDisplay
  pushbutton (SSD1331 over SPI) with pluggable graphics backends

baseurl: "/hf-isf15acp4-driver"
url: "https://n3b3x.github.io"

author:
  name: "N3b3x"
  email: "n3b3x@example.com"
  url: "https://github.com/n3b3x"

layouts_dir: _config/_layouts
includes_dir: _config/_includes

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-optional-front-matter

nav_next_prev: true

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

timezone: UTC
encoding: utf-8
lang: en

search_enabled: true
search:
  heading_level: 3
  previews: 5
  preview_words_before: 10
  preview_words_after: 15
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

nav_enabled: true
heading_anchors: true
breadcrumbs: true
toc:
  min_level: 2
  max_level: 4

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

color_scheme: dark
toggle_color_scheme: true
toggle_auto_mode: true

aux_links:
  "📚 GitHub Repository":
    - "https://github.com/N3b3x/hf-isf15acp4-driver"
  "🐛 Report Issues":
    - "https://github.com/N3b3x/hf-isf15acp4-driver/issues"

footer_content: >
  Built with ❤️ using Just the Docs • GPL v3 License •
  <a href="https://github.com/N3b3x/hf-isf15acp4-driver">View on GitHub</a>

just_the_docs:
  nav_fold: true
  nav_external_links:
    - title: "📚 GitHub Repository"
      url: "https://github.com/N3b3x/hf-isf15acp4-driver"
    - title: "🐛 Issues"
      url: "https://github.com/N3b3x/hf-isf15acp4-driver/issues"
  head_custom: _includes/head_custom.html
  custom_css:
    - assets/css/custom.css
  custom_js:
    - assets/js/custom.js

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - "*.gem"
  - "*.gemspec"
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - examples/esp32/scripts/
  - _config/doxygen-extensions/
  - src/
  - inc/
  - tests/

include:
  - _pages
  - ../README.md
  - ../LICENSE
  - assets/
  - _config/404.html

seo:
  type: "SoftwareApplication"
  name: "HardFOC ISF15ACP4 Driver"
  description: >
    Hardware-agnostic C++ driver for NKK ISF15ACP4 SmartDisplay OLED pushbutton
  url: "https://n3b3x.github.io/hf-isf15acp4-driver"
  twitter:
    card: "summary_large_image"
    site: "@n3b3x"
  og:
    type: "website"
    locale: "en_US"

social:
  name: "HardFOC ISF15ACP4 Driver"
  links:
    - "https://github.com/N3b3x/hf-isf15acp4-driver"

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]

driver:
  version: "1.0.0"
  branch: "main"
  features:
    - "SSD1331 SPI transport (software SS + D/C)"
    - "Pluggable graphics: Canvas, HardwareDirect, Animator"
    - "Debounced pushbutton UI helpers"
    - "ESP32 examples + CI matrix builds"
