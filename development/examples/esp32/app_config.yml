version: "1.0"

metadata:
  project: "ESP32 ISF15ACP4 SmartDisplay Driver Examples"
  default_app: "isf15acp4_comprehensive_test"
  target: "esp32s3"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  isf15acp4_comprehensive_test:
    description: "Comprehensive ISF15ACP4 driver validation suite"
    source_file: "isf15acp4_comprehensive_test.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "README.md"

  isf15acp4_ui_demo:
    description: "Interactive SmartDisplay UI demo with button counter"
    source_file: "isf15acp4_ui_demo.cpp"
    category: "demo"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "README.md"

  isf15acp4_animation_demo:
    description: "Procedural animation showcase (color wheel, plasma, scroll, pulse)"
    source_file: "isf15acp4_animation_demo.cpp"
    category: "demo"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "README.md"

  isf15acp4_button_dashboard:
    description: "Motor-control dashboard with gauge, debounced button, RPM simulation"
    source_file: "isf15acp4_button_dashboard.cpp"
    category: "demo"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "README.md"

build_config:
  build_types:
    Debug:
      description: "Debug build with symbols and verbose logging"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Optimized release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_isf15acp4_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
